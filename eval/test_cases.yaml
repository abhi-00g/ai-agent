# =============================================================
# ATLAS — Evaluation Test Cases
# =============================================================
# Each test case defines:
#   - id: unique identifier
#   - category: grouping for the report
#   - question: what to ask the agent
#   - expected_tools: list of tools the agent SHOULD use (order matters
#     for multi-tool tests). Empty list means no tools expected.
#   - expected_contains: keywords that MUST appear in the answer
#     (case-insensitive). At least one must match.
#   - max_steps: maximum tool calls allowed
#   - blocked: if true, the guardrails should catch this (no LLM call)
#   - sequential_group: test cases with the same group run in order
#     without resetting the agent (used for memory save → recall tests)
# =============================================================

# ----- CALCULATOR (single tool) -----
- id: calc_01
  category: calculator
  question: "What is 245 * 18?"
  expected_tools: [calculator]
  expected_contains: ["4410"]
  max_steps: 1

- id: calc_02
  category: calculator
  question: "What is (100 + 50) * 3?"
  expected_contains: ["450"]
  expected_tools: [calculator]
  max_steps: 1

- id: calc_03
  category: calculator
  question: "What is 1000 / 8?"
  expected_contains: ["125"]
  expected_tools: [calculator]
  max_steps: 1

- id: calc_04
  category: calculator
  question: "What is 2 ** 10?"
  expected_contains: ["1024"]
  expected_tools: [calculator]
  max_steps: 1

