# ----- MEMORY (sequential — save then recall) -----
- id: mem_01
  category: memory
  question: "Remember that my name is EvalTestUser"
  expected_tools: [memory]
  expected_contains: ["saved", "remember"]
  max_steps: 1
  sequential_group: memory_test

- id: mem_02
  category: memory
  question: "What is my name?"
  expected_tools: [memory]
  expected_contains: ["EvalTestUser"]
  max_steps: 1
  sequential_group: memory_test

- id: mem_03
  category: memory
  question: "Remember my favorite color is blue"
  expected_tools: [memory]
  expected_contains: ["saved", "remember"]
  max_steps: 1
  sequential_group: memory_test_2

- id: mem_04
  category: memory
  question: "What is my favorite color?"
  expected_tools: [memory]
  expected_contains: ["blue"]
  max_steps: 1
  sequential_group: memory_test_2

# ----- MULTI-TOOL CHAINING -----
- id: chain_01
  category: multi_tool
  question: "What is 365 * 24 * 60? Tell me what this number represents."
  expected_tools: [calculator]
  expected_contains: ["525600", "minutes"]
  max_steps: 2

- id: chain_02
  category: multi_tool
  question: "What day is today and what is 100 * 365?"
  expected_tools: [datetime, calculator]
  expected_contains: ["36500"]
  max_steps: 3

- id: chain_03
  category: multi_tool
  question: "Look up the population of France on Wikipedia, then calculate what 1% of that population is."
  expected_tools: [wikipedia, calculator]
  expected_contains: []
  max_steps: 4

- id: chain_04
  category: multi_tool
  question: "Search the web for the height of Mount Everest in meters, then convert it to feet using the calculator. 1 meter = 3.281 feet."
  expected_tools: [web_search, calculator]
  expected_contains: ["feet", "29"]
  max_steps: 4

